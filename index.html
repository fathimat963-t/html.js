<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMI Calculator</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark">

    <div class="container">
        <div class="row justify-content-center mt-5">

            <div class="col-md-5">

                <div class="card shadow">

                    <div class="card-header text-center bg-primary text-yellow">
                        <h3>BMI Calculator</h3>
                    </div>

                    <div class="card-body">

                      
                        <div class="mb-3">
                            <label class="form-label">Height (cm)</label>

                            <input type="number" id="height" class="form-control" placeholder="Enter height">
                        </div>

                      
                        <div class="mb-3">
                            <label class="form-label">Weight (kg)</label>

                            <input type="number" id="weight" class="form-control" placeholder="Enter weight">
                        </div>

                        <button onclick="onAddBtn()" class="btn btn-success w-100">
                            Calculate BMI
                        </button>

                   
                        <div class="text-center mt-4">
                            <h5>Your BMI</h5>

                            <h2 id="bmiText" class="text-primary">
                                No input
                            </h2>
                        </div>

                 
                        <button onclick="onDeleteClick()" class="btn btn-danger w-100 mt-3">
                            Delete
                        </button>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="./script.js"></script>

</body>

</html>
